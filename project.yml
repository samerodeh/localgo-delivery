name: LocalGO
options:
  bundleIdPrefix: com.samerodeh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  LocalGO:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LocalGO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samerodeh.localgo
        INFOPLIST_FILE: LocalGO/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        DEBUG_INFORMATION_FORMAT: dwarf
    scheme:
      testTargets: []
